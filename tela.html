<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="all-tailwind-classes-full-min.css">
    <title>login</title>
</head>
<body  class="bg-gray-100 justify-center flex items-center h-screen" >


  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm">

    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
      Entrar
    </h2>

    <form class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input
          type="email"
          placeholder="seuemail@exemplo.com"
          class="w-full mt-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Senha</label>
        <input
          type="password"
          placeholder="••••••••"
          class="w-full mt-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700 transition"
      >
        Entrar
      </button>

    </form>

    <p class="text-sm text-center text-gray-500 mt-4">
      Não tem conta?
      <a href="#" class="text-blue-600 hover:underline">Criar conta</a>
    </p>

  </div>




</html>
